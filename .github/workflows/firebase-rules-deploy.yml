name: Deploy Firestore & Storage rules

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/firebase-rules-deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/fb-sa.json"
      - name: Deploy Firestore & Storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/fb-sa.json
        run: npx --yes firebase-tools@13 deploy --only firestore:rules,storage:rules --project fifteen-pro --non-interactive
