name: Deploy Firestore & Storage rules

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/firebase-rules-deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/fb-sa.json"
      - name: Deploy Firestore rules and indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/fb-sa.json
        run: npx --yes firebase-tools@13 deploy --only firestore:rules,firestore:indexes --project fifteen-pro --non-interactive
      - name: Deploy Storage rules
        # Kept as a separate, non-blocking step: the deploy service account may
        # only have Hosting-deploy permissions today (Storage deploy needs the
        # Service Usage API enabled for its service account), and a missing
        # Storage permission shouldn't prevent the more urgent Firestore rules
        # from deploying. If this step fails, grant the service account the
        # "Firebase Rules Admin" + "Service Usage Consumer" IAM roles in
        # Google Cloud Console → IAM, then re-run this workflow.
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/fb-sa.json
        run: npx --yes firebase-tools@13 deploy --only storage:rules --project fifteen-pro --non-interactive
